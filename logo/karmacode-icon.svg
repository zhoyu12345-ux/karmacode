<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A96E"/>
      <stop offset="100%" style="stop-color:#E8D48B"/>
    </linearGradient>
  </defs>
  <!-- 深色背景 -->
  <rect width="120" height="120" rx="24" fill="#1A1A1A"/>
  <rect width="116" height="116" x="2" y="2" rx="22" fill="none" stroke="url(#grad)" stroke-width="1" opacity="0.4"/>

  <!-- 太极 -->
  <circle cx="60" cy="56" r="32" fill="none" stroke="url(#grad)" stroke-width="1.5"/>
  <path d="M60 28 A32 32 0 0 1 60 84 A16 16 0 0 1 60 56 A16 16 0 0 0 60 28" fill="url(#grad)" opacity="0.85"/>
  <circle cx="60" cy="44" r="4" fill="#1A1A1A"/>
  <circle cx="60" cy="68" r="4" fill="url(#grad)"/>

  <!-- K 字母 -->
  <text x="60" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="url(#grad)" letter-spacing="3">K</text>
</svg>
