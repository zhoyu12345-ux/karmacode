<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- 金色渐变 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A96E"/>
      <stop offset="50%" style="stop-color:#E8D48B"/>
      <stop offset="100%" style="stop-color:#A68A4A"/>
    </linearGradient>
    <!-- 暗金渐变 -->
    <linearGradient id="darkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B6914"/>
      <stop offset="100%" style="stop-color:#C9A96E"/>
    </linearGradient>
  </defs>

  <!-- 背景圆 -->
  <circle cx="200" cy="200" r="190" fill="#1A1A1A"/>
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
  <circle cx="200" cy="200" r="175" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.3"/>

  <!-- 八卦外圈 -->
  <circle cx="200" cy="200" r="145" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- 太极阴阳 -->
  <circle cx="200" cy="200" r="90" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <path d="M200 110 A90 90 0 0 1 200 290 A45 45 0 0 1 200 200 A45 45 0 0 0 200 110" fill="url(#goldGrad)" opacity="0.9"/>
  <path d="M200 110 A90 90 0 0 0 200 290 A45 45 0 0 0 200 200 A45 45 0 0 1 200 110" fill="none"/>
  <!-- 阴阳鱼眼 -->
  <circle cx="200" cy="155" r="10" fill="#1A1A1A"/>
  <circle cx="200" cy="245" r="10" fill="url(#goldGrad)"/>

  <!-- AI 神经网络节点 -->
  <g stroke="url(#darkGold)" stroke-width="1.2" fill="none" opacity="0.7">
    <circle cx="200" cy="65" r="3" fill="#E8D48B"/>
    <circle cx="240" cy="85" r="2.5" fill="#E8D48B"/>
    <circle cx="270" cy="120" r="3" fill="#E8D48B"/>
    <circle cx="280" cy="170" r="2" fill="#E8D48B"/>
    <circle cx="275" cy="225" r="3" fill="#E8D48B"/>
    <circle cx="250" cy="270" r="2.5" fill="#E8D48B"/>
    <circle cx="200" cy="325" r="3" fill="#E8D48B"/>
    <circle cx="150" cy="310" r="2" fill="#E8D48B"/>
    <circle cx="110" cy="280" r="3" fill="#E8D48B"/>
    <circle cx="115" cy="225" r="2.5" fill="#E8D48B"/>
    <circle cx="130" cy="170" r="3" fill="#E8D48B"/>
    <circle cx="110" cy="115" r="2" fill="#E8D48B"/>
    <circle cx="140" cy="90" r="2.5" fill="#E8D48B"/>
    <!-- 连接线 -->
    <line x1="200" y1="65" x2="240" y2="85"/>
    <line x1="240" y1="85" x2="270" y2="120"/>
    <line x1="270" y1="120" x2="280" y2="170"/>
    <line x1="280" y1="170" x2="275" y2="225"/>
    <line x1="275" y1="225" x2="250" y2="270"/>
    <line x1="250" y1="270" x2="200" y2="325"/>
    <line x1="200" y1="325" x2="150" y2="310"/>
    <line x1="150" y1="310" x2="130" y2="280"/>
    <line x1="130" y1="280" x2="115" y2="225"/>
    <line x1="115" y1="225" x2="130" y2="170"/>
    <line x1="130" y1="170" x2="110" y2="115"/>
    <line x1="110" y1="115" x2="140" y2="90"/>
    <line x1="140" y1="90" x2="200" y2="65"/>
    <line x1="200" y1="65" x2="200" y2="110"/>
    <line x1="200" y1="290" x2="200" y2="325"/>
  </g>

  <!-- 文字 -->
  <text x="200" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="url(#goldGrad)" letter-spacing="6">
    KARMACODE
  </text>
</svg>
